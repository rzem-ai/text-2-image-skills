name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills-cli:
    name: Skills CLI compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install the pinned CLI
        run: npm ci --ignore-scripts

      - name: Check discovery and isolated installations
        run: npm run test:skills

  validate:
    name: Validate and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Test release tooling
        run: python -m unittest discover -s tests -v

      - name: Validate all skills
        run: python scripts/package_skills.py --check

      - name: Build and verify skill archives
        run: |
          python scripts/package_skills.py
          cd dist
          sha256sum --check SHA256SUMS

      - name: Save validated skill archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-packages
          path: |
            dist/*.skill
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
